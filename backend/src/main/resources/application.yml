spring:
  application:
    name: farmlink-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: http://localhost:5173
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:farmconnectprices-dev}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
    use-emulator: ${FIREBASE_USE_EMULATOR:false}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:localhost:8081}


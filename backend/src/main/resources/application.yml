spring:
  application:
    name: farmlink-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: http://localhost:5173
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:farmconnectprices}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
    use-emulator: ${FIREBASE_USE_EMULATOR:false}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:localhost:8081}

firestore:
  quota:
    cooldown-ms: ${FIRESTORE_QUOTA_COOLDOWN_MS:60000}

data-gov-in:
  base-url: ${DATA_GOV_IN_BASE_URL:https://api.data.gov.in/resource}
  resource-id: ${DATA_GOV_IN_RESOURCE_ID:35985678-0d79-46b4-9ed6-6f13308a1d24}
  daily-resource-id: ${DATA_GOV_IN_DAILY_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
  api-key: ${DATA_GOV_IN_API_KEY:}
  enabled: ${MARKET_PRICE_INGEST_ENABLED:false}
  mode: ${MARKET_PRICE_INGEST_MODE:INCREMENTAL}
  page-size: ${MARKET_PRICE_INGEST_PAGE_SIZE:1000}
  max-pages: ${MARKET_PRICE_INGEST_MAX_PAGES:10}
  lookback-days: ${MARKET_PRICE_INGEST_LOOKBACK_DAYS:30}
  initial-offset: ${MARKET_PRICE_INGEST_INITIAL_OFFSET:0}
  retry-attempts: ${MARKET_PRICE_INGEST_RETRY_ATTEMPTS:3}
  request-timeout-ms: ${MARKET_PRICE_INGEST_REQUEST_TIMEOUT_MS:10000}

market-price:
  ingestion:
    enabled: ${MARKET_PRICE_INGEST_ENABLED:false}
    cron: ${MARKET_PRICE_INGEST_CRON:0 30 18 * * *}
    mode: ${MARKET_PRICE_INGEST_MODE:INCREMENTAL}
    page-size: ${MARKET_PRICE_INGEST_PAGE_SIZE:1000}
    max-pages: ${MARKET_PRICE_INGEST_MAX_PAGES:10}
    lookback-days: ${MARKET_PRICE_INGEST_LOOKBACK_DAYS:30}

farmconnectprices:
  discovery:
    cache:
      enabled: ${DISCOVERY_CACHE_ENABLED:true}
      ttl-minutes: ${DISCOVERY_CACHE_TTL_MINUTES:60}

spring:
  application:
    name: farmlink-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  disputes:
    cursor-signing-secret: ${DISPUTE_CURSOR_SECRET:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:farmconnectprices}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
    use-emulator: ${FIREBASE_USE_EMULATOR:false}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:localhost:8081}
  llm:
    provider: ${APP_LLM_PROVIDER:NONE}
    gemini:
      enabled: ${APP_LLM_GEMINI_ENABLED:false}
      model: ${APP_LLM_GEMINI_MODEL:}
      api-key: ${GEMINI_API_KEY:}
      timeout-seconds: ${APP_LLM_GEMINI_TIMEOUT_SECONDS:30}
  router:
    session-ttl-ms: 1800000
    lock-lease-ms: 15000
    heartbeat-interval-ms: 5000
    result-ttl-seconds: 900
    max-payload-bytes: 65536
    max-query-code-points: 1000
    max-normalized-query-bytes: 4096
    min-turn-index: 1
    max-valid-turn-index: 2147483646
    terminal-sentinel-turn-index: 2147483647

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dyp4rhbog}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

firestore:
  quota:
    cooldown-ms: ${FIRESTORE_QUOTA_COOLDOWN_MS:60000}

data-gov-in:
  base-url: ${DATA_GOV_IN_BASE_URL:https://api.data.gov.in/resource}
  resource-id: ${DATA_GOV_IN_RESOURCE_ID:35985678-0d79-46b4-9ed6-6f13308a1d24}
  daily-resource-id: ${DATA_GOV_IN_DAILY_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
  api-key: ${DATA_GOV_IN_API_KEY:}
  enabled: ${MARKET_PRICE_INGEST_ENABLED:false}
  mode: ${MARKET_PRICE_INGEST_MODE:INCREMENTAL}
  page-size: ${MARKET_PRICE_INGEST_PAGE_SIZE:1000}
  max-pages: ${MARKET_PRICE_INGEST_MAX_PAGES:10}
  lookback-days: ${MARKET_PRICE_INGEST_LOOKBACK_DAYS:30}
  initial-offset: ${MARKET_PRICE_INGEST_INITIAL_OFFSET:0}
  retry-attempts: ${MARKET_PRICE_INGEST_RETRY_ATTEMPTS:3}
  request-timeout-ms: ${MARKET_PRICE_INGEST_REQUEST_TIMEOUT_MS:10000}

market-price:
  ingestion:
    enabled: ${MARKET_PRICE_INGEST_ENABLED:false}
    cron: ${MARKET_PRICE_INGEST_CRON:0 30 18 * * *}
    mode: ${MARKET_PRICE_INGEST_MODE:INCREMENTAL}
    page-size: ${MARKET_PRICE_INGEST_PAGE_SIZE:1000}
    max-pages: ${MARKET_PRICE_INGEST_MAX_PAGES:10}
    lookback-days: ${MARKET_PRICE_INGEST_LOOKBACK_DAYS:30}

farmconnectprices:
  discovery:
    cache:
      enabled: ${DISCOVERY_CACHE_ENABLED:true}
      ttl-minutes: ${DISCOVERY_CACHE_TTL_MINUTES:60}

trend:
  rising-threshold-percent: ${TREND_RISING_THRESHOLD_PERCENT:2.0}
  falling-threshold-percent: ${TREND_FALLING_THRESHOLD_PERCENT:2.0}

